# npm install -g wrangler
# wrangler dev

name = "webdav-music"
main = "worker.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "MUSIC_KV"
id = "ccd2e2a68b074c6a850bb908d3507358"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = false


